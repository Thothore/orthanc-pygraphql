name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  commitlint:
    name: Lint Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Conventional Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          failOnWarnings: false

  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yapf pylint pydicom ariadne

      - name: Check format with yapf
        run: yapf --diff --style google --recursive orthanc/python/ > yapf_diff.patch || true
        
      - name: Show yapf formatting errors
        run: |
          if [ -s yapf_diff.patch ]; then
            echo "::error title=YAPF Formatting Error::Formatting issues found. Run 'yapf --in-place --style google --recursive orthanc/python/' locally."
            echo "--- DIFF ---"
            cat yapf_diff.patch
            exit 1
          fi

      - name: Run pylint
        run: |
          pylint orthanc/python/ \
            --msg-template="::error file={path},line={line},col={column},title=Pylint ({msg_id})::{category}: {msg}"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with docker compose
        run: docker compose build

      - name: Start docker compose
        run: docker compose up -d

      - name: Wait for Orthanc to be ready
        run: |
          echo "Waiting for Orthanc to start..."
          timeout 30 bash -c 'while ! curl -s -f -u demo:demo http://localhost:8000/system; do sleep 2; done'
          echo "Orthanc is ready!"

      - name: Test GraphQL Endpoint
        run: |
          response=$(curl -s -X POST -u demo:demo -H "Content-Type: application/json" -d '{"query": "{ patients { id } }"}' http://localhost:8000/graphql)
          echo "Response: $response"
          # Check if the output contains the expected patients string structure for an empty/successful list
          if [[ "$response" != *'"patients":'* ]]; then
            echo "GraphQL test failed. Unexpected response."
            exit 1
          fi
          echo "GraphQL test passed!"
